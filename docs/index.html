<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سراج — منصة المتابعة</title>
<meta name="description" content="منصة متابعة مشروع سراج التأهيلي">
<meta name="theme-color" content="#11131D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="سراج">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
@font-face{font-family:"Thmanyah Serif Text";src:url("fonts/thmanyahseriftext-Light.otf") format("opentype");font-weight:300;font-display:swap}
@font-face{font-family:"Thmanyah Serif Text";src:url("fonts/thmanyahseriftext-Regular.otf") format("opentype");font-weight:400;font-display:swap}
@font-face{font-family:"Thmanyah Serif Text";src:url("fonts/thmanyahseriftext-Medium.otf") format("opentype");font-weight:500;font-display:swap}
@font-face{font-family:"Thmanyah Serif Text";src:url("fonts/thmanyahseriftext-Bold.otf") format("opentype");font-weight:700;font-display:swap}
@font-face{font-family:"Thmanyah Serif Text";src:url("fonts/thmanyahseriftext-Black.otf") format("opentype");font-weight:900;font-display:swap}
:root{
  --night:#11131D;--night2:#1B1E2D;--night3:#262A3D;--cream:#F5F2EA;--paper:#FFFDF8;--ink:#14161F;--mute:#6E6B63;--line:#E7E0D0;
  --gold:#C8963E;--gold-deep:#8F611A;--amber:#F0B354;--glow:#FFE9A8;
  --ok:#2F7D5C;--ok-bg:#E4F1EA;--warn:#A9690F;--warn-bg:#FBEFD6;--bad:#B4432F;--bad-bg:#F9E3DD;--info-bg:#ECE9F3;--navy:#2B3158;
  --c-quran:#2F7D5C;--c-edu:#8F611A;--c-sharia:#2B5F8F;--c-lead:#7A3E6E;--c-skill:#B4532F;
  --r:18px;--sh:0 1px 2px rgba(20,22,31,.05),0 8px 24px -12px rgba(20,22,31,.18);
  --font:"Thmanyah Brand","Thmanyah Serif Text","Noto Naskh Arabic","Geeza Pro",serif;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--cream);color:var(--ink);font-size:15.5px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.lock{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;text-align:inherit}
a{color:var(--gold-deep);text-decoration:none}
svg{width:1.25em;height:1.25em;flex:none;vertical-align:-.22em}
h1,h2,h3{font-weight:700;line-height:1.35}
small{font-size:.82em;color:var(--mute)}
em{font-style:normal}
.grow{flex:1;min-width:0}.row{display:flex;align-items:center}.gap{gap:10px;margin-top:14px;flex-wrap:wrap}.mute{color:var(--mute)}.center{text-align:center}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ── المصباح ── */
.lantern{width:auto;height:auto;overflow:visible}
.lantern .flame{transform-origin:60px 103px;animation:flick 2.4s ease-in-out infinite}
.lantern .lglow{animation:breath 3.6s ease-in-out infinite;transform-origin:60px 88px}
.lantern .lrays{transform-origin:60px 88px;animation:rays 3.6s ease-in-out infinite}
.lantern .lstars path{animation:twinkle 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.lantern .lstars path:nth-child(2){animation-delay:.9s}.lantern .lstars path:nth-child(3){animation-delay:1.7s}
.lantern.mini .lrays,.lantern.mini .lstars,.lantern.inring .lrays,.lantern.inring .lstars{display:none}
@keyframes rays{0%,100%{opacity:.25;transform:scale(.96)}50%{opacity:.7;transform:scale(1.05)}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
@keyframes flick{0%,100%{transform:scale(1,1) rotate(-1.5deg)}35%{transform:scale(.94,1.07) rotate(2deg)}70%{transform:scale(1.05,.95) rotate(-1deg)}}
@keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.lantern.mini{width:30px;height:42px}.lantern.big{width:170px;height:240px}.lantern.inring{width:46px;height:64px}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* ── الهيكل ── */
.app{display:flex;min-height:100dvh}
.side{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;padding:8px 16px;padding-top:max(8px,env(safe-area-inset-top));background:rgba(17,19,29,.94);backdrop-filter:blur(10px);color:#fff}
.logo{display:flex;align-items:center;gap:8px}.logo b{font-size:1.5rem;font-weight:900;color:#fff;line-height:1}.logo small{color:#B9B4A6;display:block}
.ib{position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:inherit}
.ib:hover{background:rgba(255,255,255,.1)}.card .ib{background:var(--cream)}.card .ib:hover{background:var(--line)}
.ib svg{width:22px;height:22px}
.dot{position:absolute;top:3px;inset-inline-end:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center;font-style:normal;box-shadow:0 0 0 2px var(--night)}
.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--amber),var(--gold-deep));color:var(--night);font-weight:900;display:grid;place-items:center;flex:none;line-height:1}
.av.xl{width:58px;height:58px;font-size:1.6rem}
#view{flex:1;padding:14px 16px calc(96px + env(safe-area-inset-bottom))}
.page{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.page.anim{animation:pagein .3s ease}
@keyframes pagein{from{transform:translateY(8px)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.bnav{position:fixed;bottom:0;inset-inline:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,253,248,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.bl{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;border-radius:14px;color:var(--mute);font-size:.74rem;font-weight:500}
.bl svg{width:23px;height:23px}.bl.on{color:var(--night);background:linear-gradient(180deg,rgba(240,179,84,.28),rgba(240,179,84,.08));font-weight:700}.bl.on svg{color:var(--gold-deep)}
@media (min-width:900px){
  .side{display:flex;flex-direction:column;gap:22px;width:250px;flex:none;position:sticky;top:0;height:100dvh;padding:26px 18px;background:var(--night);color:#fff;background-image:radial-gradient(420px 320px at 80% 0,rgba(240,179,84,.16),transparent 70%)}
  .side nav{display:flex;flex-direction:column;gap:4px;flex:1}
  .sl{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:#C9C4B6;font-weight:500}
  .sl:hover{background:rgba(255,255,255,.06)}.sl.on{background:rgba(240,179,84,.16);color:var(--glow);font-weight:700}
  .who{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:rgba(255,255,255,.06);color:#fff}.who b{display:block;font-size:.92rem;line-height:1.3}.who small{color:#B9B4A6}
  .top{background:transparent;backdrop-filter:none;color:var(--ink);padding:14px 28px 0;position:static}.top .logo,.top .avb{display:none}.top .ib{background:var(--paper);box-shadow:var(--sh)}.top .dot{box-shadow:0 0 0 2px var(--cream)}
  .bnav{display:none}#view{padding:10px 28px 40px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
}
.cols{display:flex;flex-direction:column;gap:14px}
@media (min-width:900px){.cols{display:grid}}

/* ── البطاقات ── */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:10px}.ch h3{font-size:1.06rem;flex:1;display:flex;align-items:center;gap:7px}.ch h3 svg{color:var(--gold-deep)}.ch a{font-size:.85rem;font-weight:500}
.count{background:var(--night);color:var(--glow);border-radius:20px;padding:0 9px;font-size:.8rem;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:.74rem;font-weight:700;white-space:nowrap;flex:none}
.chip svg{width:13px;height:13px}
.chip.approved,.chip.done{background:var(--ok-bg);color:var(--ok)}.chip.submitted{background:var(--info-bg);color:var(--navy)}.chip.revise{background:var(--warn-bg);color:var(--warn)}
.chip.late{background:var(--bad-bg);color:var(--bad)}.chip.due{background:#F6E7C6;color:var(--gold-deep)}.chip.upcoming{background:#EFECE4;color:var(--mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:8px 18px;border-radius:14px;font-weight:700;transition:transform .12s,box-shadow .2s,background .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}.btn[disabled]{opacity:.5}
.btn.gold{background:linear-gradient(135deg,#F3BE63,#C8963E);color:var(--night);box-shadow:0 6px 18px -8px rgba(200,150,62,.9)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}.btn.ghost:hover{background:var(--cream)}.btn.danger{color:var(--bad)}
.btn.ok{background:var(--ok);color:#fff}.btn.okf{background:var(--ok-bg);color:var(--ok)}.btn.warn{background:var(--warn-bg);color:var(--warn)}
.btn.sm{min-height:34px;padding:4px 12px;border-radius:10px;font-size:.82rem}.btn.wide{width:100%;margin-top:14px}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 10px;color:var(--mute);text-align:center}.empty svg{width:34px;height:34px;opacity:.5}.empty.sm{padding:12px;flex-direction:row;justify-content:center}.empty.sm svg{width:20px;height:20px;color:var(--ok);opacity:1}

/* ── البطل ── */
.hero,.mhead{position:relative;overflow:hidden;border-radius:24px;background:var(--night);color:#fff;padding:20px 18px 16px;isolation:isolate}
.h-rays,.g-rays{position:absolute;inset:0;z-index:-1;background:radial-gradient(360px 300px at 12% 28%,rgba(240,179,84,.34),transparent 70%),radial-gradient(500px 320px at 100% 110%,rgba(143,97,26,.35),transparent 70%)}
.hero small,.mhead small{color:#BDB8AA}
.h-top{display:flex;align-items:center;gap:12px;justify-content:space-between}
.hero h1{font-size:1.75rem;font-weight:900;margin:2px 0}.hero p{color:#DDD8CA;font-size:.92rem}
.pace{display:inline-block;margin-top:8px;padding:2px 12px;border-radius:20px;font-size:.78rem;font-weight:700}.pace.good{background:rgba(111,207,151,.16);color:#8FE0B4}.pace.slow{background:rgba(240,179,84,.18);color:var(--amber)}
.ring{position:relative;width:128px;height:128px;flex:none}.ring>svg{width:100%;height:100%;transform:rotate(-90deg)}
.rt{fill:none;stroke:rgba(255,255,255,.1);stroke-width:7}.rv{fill:none;stroke:var(--amber);stroke-width:7;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(240,179,84,.7));transition:stroke-dasharray 1s ease}
.rin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.rin b{font-size:1.25rem;font-weight:900;line-height:1;color:var(--glow);margin-top:-4px}.rin b i{font-size:.7em;font-style:normal}
.h-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1)}
.h-stats div{text-align:center}.h-stats b{display:block;font-size:1.35rem;font-weight:900;line-height:1.2;color:#fff}.h-stats b i{font-size:.6em;font-style:normal;color:var(--amber)}.h-stats small{font-size:.72rem;display:flex;gap:2px;justify-content:center;align-items:center}.h-stats svg{width:13px;height:13px;color:var(--amber)}
@media (min-width:900px){.hero{padding:30px 34px 22px}.hero h1{font-size:2.3rem}.ring{width:160px;height:160px}.lantern.inring{width:58px;height:80px}.rin b{font-size:1.5rem}}

/* ── التنبيهات ── */
.al{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;margin-top:8px;border-inline-start:4px solid var(--c,var(--line));background:var(--b,var(--cream));cursor:pointer}
.al:not([data-req]):not([data-go]):not([data-readn]):not([data-tafsir-today]){cursor:default}
.al b{display:block;font-size:.93rem;line-height:1.45}.al small{display:block;line-height:1.5}.al em{font-size:.72rem;color:var(--mute);white-space:nowrap}
.aic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--c);flex:none}.aic svg{width:18px;height:18px}
.k-bad{--c:var(--bad);--b:var(--bad-bg)}.k-warn{--c:var(--warn);--b:var(--warn-bg)}.k-gold{--c:var(--gold);--b:#FAF0D9}.k-ok{--c:var(--ok);--b:var(--ok-bg)}.k-info{--c:var(--navy);--b:var(--info-bg)}
.k-navy{--c:var(--amber);--b:var(--night);color:#fff}.k-navy small{color:#C9C4B6}.k-navy .aic{background:rgba(240,179,84,.18);color:var(--amber)}

/* ── المتطلبات ── */
.reqs{display:flex;flex-direction:column}
.req{display:flex;align-items:center;gap:11px;width:100%;padding:11px 4px;border-top:1px solid var(--line);border-radius:10px;transition:background .15s}
.reqs .req:first-child{border-top:0}.req:hover{background:var(--cream)}
.rmain{flex:1;min-width:0;display:flex;flex-direction:column}.rmain b{font-size:.95rem;line-height:1.45}.rmain small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rmain .due{color:var(--gold-deep);font-weight:500}
.st-late .due{color:var(--bad)}.st-upcoming{opacity:.72}
.ric{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none;color:var(--k);background:color-mix(in srgb,var(--k) 13%,#fff)}.ric svg{width:21px;height:21px}.ric.big{width:50px;height:50px;border-radius:16px}.ric.big svg{width:26px;height:26px}
.c-quran{--k:var(--c-quran)}.c-edu{--k:var(--c-edu)}.c-sharia{--k:var(--c-sharia)}.c-lead{--k:var(--c-lead)}.c-skill{--k:var(--c-skill)}
.stars{display:inline-flex;gap:1px;color:#D9D3C3}.stars i{display:grid}.stars svg{width:15px;height:15px}.stars .on{color:var(--amber)}.stars.sm svg{width:13px;height:13px}
.wird{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,#FFF7E4,var(--paper) 60%);border-color:#EBD9AE}
.wird b{display:block;font-size:1.05rem}.wird small{display:block}.wird.done{background:linear-gradient(120deg,var(--ok-bg),var(--paper) 60%);border-color:#C5E0D2}
.comps{display:flex;flex-direction:column;gap:12px}.comp{display:flex;gap:11px;align-items:center}.comp em{font-weight:700;font-size:.9rem}
.bar{height:7px;border-radius:7px;background:#EFEAE0;overflow:hidden;margin:3px 0 2px}.bar i{display:block;height:100%;border-radius:7px;background:var(--k);transition:width .8s ease}

/* ── مسار المصابيح ── */
.lamps{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.lm{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 2px 6px;border-radius:14px;background:var(--night);color:#fff}.lm small{color:#BDB8AA;font-size:.7rem}.lm.cur{box-shadow:0 0 0 2px var(--amber)}
.lm div{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lamp{display:inline-block;width:13px;height:13px;border-radius:50%;background:#3A3F58;flex:none}
.lamp.full{background:var(--glow);box-shadow:0 0 10px 3px rgba(240,179,84,.85)}.lamp.part{background:linear-gradient(90deg,#3A3F58 50%,var(--amber) 50%)}.lamp.late{background:#3A3F58;box-shadow:inset 0 0 0 2px var(--bad)}
.lamp.now{background:var(--amber);animation:pulse 1.8s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(240,179,84,.25)}}
@media (min-width:600px){.lm div{grid-template-columns:repeat(4,1fr)}.lamp{width:15px;height:15px}}

/* ── المسار ── */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}.tabs::-webkit-scrollbar{display:none}
.tabs>*{flex:none;padding:7px 15px;border-radius:22px;background:var(--paper);border:1px solid var(--line);color:var(--ink);font-weight:500;font-size:.88rem;white-space:nowrap}
.tabs .on{background:var(--night);color:var(--glow);border-color:var(--night);font-weight:700}.tabs .cur:not(.on){border-color:var(--gold)}.tabs i{font-style:normal;opacity:.6;font-size:.85em}
.mhead h1{font-size:1.5rem;font-weight:900;margin:2px 0 14px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1)}.mgrid small{display:block}.mgrid b{font-weight:500;font-size:.92rem;line-height:1.5;display:block;color:var(--glow)}
@media (min-width:900px){.mgrid{grid-template-columns:repeat(4,1fr)}.mhead{padding:28px 34px}.mhead h1{font-size:2rem}.tabs{margin:0;padding-inline:0}}
.week.now{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),var(--sh)}.week .ch h3 .lamp{box-shadow:none}
.week .ch h3 .lamp:not(.full):not(.now):not(.part){background:#D9D3C3}.week .ch h3 .lamp.full{background:var(--amber)}
.tafsir{background:var(--cream);border-radius:14px;padding:10px 12px;margin-bottom:6px}.tafsir small svg{color:var(--c-quran)}
.tds{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.td{aspect-ratio:1;max-height:44px;border-radius:12px;background:#fff;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--mute);font-size:.85rem;justify-self:stretch}
.td i{font-style:normal;display:grid}.td.on{background:var(--c-quran);border-color:var(--c-quran);color:#fff}.td.miss{border-color:#E6B8AD;color:var(--bad);background:var(--bad-bg)}.td.fut{opacity:.55}.td.today{box-shadow:0 0 0 2px var(--amber)}

/* ── التقويم ── */
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;text-align:center}.calh h2{font-size:1.2rem}
.wd,.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.wd span{text-align:center;font-size:.68rem;color:var(--mute);font-weight:500;padding-bottom:4px;overflow:hidden}
.dc{position:relative;min-height:54px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:4px 0 9px;background:transparent;line-height:1.2}
.dc b{font-size:1rem;font-weight:700}.dc small{font-size:.62rem}.dc.out b{color:#B5AFA0;font-weight:400}.dc.in{background:var(--cream)}
.dc.tf{background:var(--ok-bg)}.dc.tf b{color:var(--ok)}.dc.tm{background:var(--bad-bg)}
.dc.today{box-shadow:inset 0 0 0 2px var(--amber)}.dc.sel{background:var(--night)!important}.dc.sel b{color:var(--glow)}.dc.sel small{color:#BDB8AA}
.dots{position:absolute;bottom:4px;display:flex;gap:3px}.d{display:inline-block;width:6px;height:6px;border-radius:50%}
.d.navy{background:var(--navy)}.dc.sel .d.navy{background:#fff}.d.gold{background:var(--gold)}.d.ok{background:var(--ok)}.d.bad{background:var(--bad)}.d.ev{background:var(--c-lead)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:.75rem;color:var(--mute)}.legend span{display:flex;align-items:center;gap:5px}.sq{width:12px;height:12px;border-radius:4px;background:var(--ok-bg);border:1px solid #BFDccd}
@media (min-width:900px){.p-cal{display:grid;grid-template-columns:1.25fr 1fr;align-items:start}.dc{min-height:70px}}

/* ── النوافذ ── */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(17,19,29,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:relative;width:100%;max-width:560px;max-height:92dvh;overflow:auto;background:var(--paper);border-radius:26px 26px 0 0;padding:26px 18px calc(22px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:26px;padding:30px 28px}}
.sx{position:absolute;top:12px;inset-inline-end:12px;width:38px;height:38px;border-radius:50%;background:var(--cream);display:grid;place-items:center}

  let missed = 0;
  for (let i = 0; i < passed - 1; i++) if (!S.tafsir[addDays(startDate(), i)]) missed++;
  return { tafsirDone, passed, overall, expected, committed, streak, avg, scored: scores.length, byComp, missed,
    late: REQS.filter((r) => statusOf(r) === "late"), revise: REQS.filter((r) => statusOf(r) === "revise"), pending: REQS.filter((r) => statusOf(r) === "submitted") };
}
// حالة الأسبوع لمسار المصابيح: full | part | late | now | off
function weekState(w) {
  const p = nowPos(), rs = REQS.filter((r) => r.week === w && !r.monthly);
  let t = 0;
  for (let i = 0; i < 7; i++) if (S.tafsir[addDays(weekStart(w), i)]) t++;
  const done = rs.filter(isDone).length, frac = (t / 7 + done) / (1 + rs.length);
  if (frac >= 0.999) return "full";
  if (p.phase === "during" && w === p.week) return "now";
  if (p.phase !== "before" && (w < p.week || p.phase === "after")) return frac > 0 ? "part" : "late";
  return frac > 0 ? "part" : "off";
}

// ───────────────────────── طبقة البيانات ─────────────────────────
// الوضع المحلي: الحالة في localStorage والملفات في IndexedDB (للمعاينة قبل ربط قاعدة البيانات).
// كل الواجهة تمر عبر api.* حتى يُستبدل هذا الملف بمحوّل Supabase دون تغيير الواجهات.
const DEMO = QS.has("demo");
const KEY = DEMO ? "siraj.demo" : "siraj.v1";
const blank = () => ({ settings: { start: "2026-11-21", meetings: [], names: { reviewer: "المتابع", member: "المستفيد" } }, subs: {}, checks: {}, rasd: {}, tafsir: {}, events: [], notifs: [] });
let S = blank();
let ME = null; // {role:'reviewer'|'member', name}

const idb = () => new Promise((res, rej) => { const r = indexedDB.open("siraj-files", 1); r.onupgradeneeded = () => r.result.createObjectStore("f"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const idbDo = async (mode, fn) => { const db = await idb(); return new Promise((res, rej) => { const t = db.transaction("f", mode), q = fn(t.objectStore("f")); t.oncomplete = () => res(q.result); t.onerror = () => rej(t.error); }); };

const api = {
  mode: "local",
  read() {
    try { const j = JSON.parse(localStorage.getItem(KEY) || "null"); S = j ? { ...blank(), ...j, settings: { ...blank().settings, ...j.settings } } : blank(); } catch { S = blank(); }
    buildReqs();
  },
  async load() {
    this.read();
    if (DEMO && !localStorage.getItem(KEY)) seedDemo();

  },
  save() { localStorage.setItem(KEY, JSON.stringify(S)); buildReqs(); if (ME) ME.name = S.settings.names[ME.role]; },
  async signIn(role) { localStorage.setItem("siraj.me", role); ME = { role, name: S.settings.names[role] }; },
  async signOut() { localStorage.removeItem("siraj.me"); ME = null; },

  notify(to, kind, title, body, req) { S.notifs.unshift({ id: uid(), to, kind, title, body: body || "", req: req || null, at: new Date().toISOString(), read: false }); S.notifs = S.notifs.slice(0, 300); },
  async markRead(ids) { S.notifs.forEach((n) => { if (ids.includes(n.id)) n.read = true; }); this.save(); },

  async submit(reqId, { title, body, file }) {
    const r = REQ[reqId], prev = S.subs[reqId];
    let f = prev?.file || null;
    if (file) { f = { id: uid(), name: file.name, type: file.type, size: file.size }; await idbDo("readwrite", (s) => s.put(file, f.id)); }
    const history = prev?.reviewedAt ? [...(prev.history || []), { status: prev.status, score: prev.score, note: prev.note, at: prev.reviewedAt }] : prev?.history || [];
    S.subs[reqId] = { reqId, title, body, file: f, at: new Date().toISOString(), status: "submitted", score: null, note: "", reviewedAt: null, history };
    this.notify("reviewer", "submit", prev ? "أُعيد رفع متطلب" : "رُفع متطلب جديد", `${r.title} — بانتظار تقييمك`, reqId);
    this.save();
  },
  async review(reqId, { status, score, note }) {
    const s = S.subs[reqId]; if (!s) return;
    Object.assign(s, { status, score, note, reviewedAt: new Date().toISOString() });
    const r = REQ[reqId];
    this.notify("member", status === "approved" ? "approved" : "revise", status === "approved" ? "اعتُمد متطلبك" : "متطلب يحتاج استكمالاً", `${r.title}${score ? ` · التقييم ${score}/5` : ""}${note ? ` — ${note}` : ""}`, reqId);
    this.save();
  },
  async saveRasd(week, d) {
    const was = S.rasd[week]; S.rasd[week] = { week, ...d, at: new Date().toISOString() };
    this.notify("reviewer", "submit", was ? "عُدّل الرصد الأسبوعي" : "رُفع الرصد الأسبوعي", `${weekName(week)} — ${rasdText(S.rasd[week])}`, `rasd-w${week}`); this.save();
  },
  async toggleCheck(reqId) { if (S.checks[reqId]) delete S.checks[reqId]; else S.checks[reqId] = new Date().toISOString(); this.save(); },
  async setTafsir(date, on) { if (on) S.tafsir[date] = true; else delete S.tafsir[date]; this.save(); },
  async nudge(reqId) { const r = REQ[reqId]; this.notify("member", "nudge", "تذكير من المتابع", `${r.title} — ${ST[statusOf(r)].label}، ${dueText(r)}`, reqId); this.save(); },
  async message(text) { this.notify(ME.role === "reviewer" ? "member" : "reviewer", "msg", `رسالة من ${firstName(ME.name)}`, text); this.save(); },
  async addEvent(ev) { S.events.push({ id: uid(), ...ev }); this.notify("member", "event", "موعد جديد في التقويم", `${ev.title} — ${fmtDay(ev.date)}`); this.save(); },
  async delEvent(id) { S.events = S.events.filter((e) => e.id !== id); this.save(); },
  async saveSettings(st) {
    const moved = st.meetings.map((d, i) => d && d !== meetingDate(i + 1) ? i + 1 : 0).filter(Boolean);
    S.settings = { ...S.settings, ...st };
    buildReqs();
    moved.forEach((m) => this.notify("member", "event", "تغيّر موعد اللقاء", `اللقاء ${ORD[m]} — ${fmtDay(meetingDate(m))}`));
    this.save();
  },
  async addRef(refId, { label, url, file }) {
    const it = { id: uid(), label };
    if (file) { await idbDo("readwrite", (s) => s.put(file, "ref:" + it.id)); it.name = file.name; it.local = true; } else it.url = url;
    const refs = { ...(S.settings.refs || {}) }; refs[refId] = [...(refs[refId] || []), it]; S.settings.refs = refs; this.save();
  },
  async delRef(refId, id) { const refs = { ...(S.settings.refs || {}) }; refs[refId] = (refs[refId] || []).filter((x) => x.id !== id); S.settings.refs = refs; this.save(); },
  async refUrl(it) { if (it.url) return it.url; const b = await idbDo("readonly", (s) => s.get("ref:" + it.id)); return b ? URL.createObjectURL(b) : null; },
  async fileUrl(f) { const b = await idbDo("readonly", (s) => s.get(f.id)); return b ? URL.createObjectURL(b) : null; },
};

// بيانات معاينة فقط (‎?demo) — تُحفظ في مفتاح منفصل ولا تمس البيانات الحقيقية
function seedDemo() {
  S.settings.names = { reviewer: "عبدالله", member: "أحمد السالم" };
  const p = nowPos(); if (p.phase === "before") return api.save();
  let x = 11; const rnd = () => (x = (x * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i <= p.di && i < TOTAL_DAYS; i++) if (i === p.di ? false : rnd() > 0.12 || i > p.di - 4) S.tafsir[addDays(startDate(), i)] = true;
  const notes = ["ملخص متقن ووقفات عميقة، بارك الله فيك", "جيد، ويحسن ربط الوقفة بتطبيق عملي في الحلقة", "أحسنت، استمر على هذا المستوى", "اختصار مفيد، أضف الأدلة في المرة القادمة"];
  REQS.filter((r) => r.open <= today()).forEach((r) => {
    const past = r.due < today(), last = r.week === p.week - 1;
    if (r.type === "rasd") { if (past && rnd() > 0.1) { const a = 440 + (r.week - 1) * 7; S.rasd[r.week] = { week: r.week, attendance: rnd() > 0.15 ? "present" : "excused", from: `${surahsOf(a, a)} ص ${a}`, to: `${surahsOf(a + 6, a + 6)} ص ${a + 6}`, note: "", at: new Date(s2d(r.due)).toISOString() }; } return; }
    if (r.type === "read") { if (past ? rnd() > 0.1 : rnd() > 0.6) S.checks[r.id] = new Date().toISOString(); return; }
    if (!past || (r.monthly && r.due >= today())) return;
    if (rnd() < 0.1) return;
    const st = last ? (r.type === "fiqh" ? "revise" : "submitted") : "approved";
    S.subs[r.id] = { reqId: r.id, title: r.title, body: r.type === "tadabbur" ? "المعنى: تأمل في دلائل القدرة وإحياء الأرض الميتة.\nالوقفة: كل آية كونية رسالة لمن يعتبر.\nالعمل: تخصيص عشر دقائق بعد الفجر للتدبر مع الطلاب." : "خلاصة مسائل الأسبوع مع أدلتها المختصرة، مرتبة بحسب المقاطع.", file: null, at: new Date(s2d(r.due) - DAY).toISOString(), status: st,
      score: st === "approved" ? 4 + Math.round(rnd()) : st === "revise" ? 3 : null, note: st === "approved" ? notes[Math.floor(rnd() * notes.length)] : st === "revise" ? "ينقصه ذكر الأدلة لمسائل المقطع الثاني" : "", reviewedAt: st === "submitted" ? null : new Date(s2d(r.due)).toISOString(), history: [] };
  });
  const w = Math.max(1, p.week - 1);
  api.notify("member", "approved", "اعتُمد متطلبك", `ورقة التدبر — الأسبوع ${Math.max(1, w - 1)} · التقييم 5/5 — أحسنت، استمر على هذا المستوى`, `tadabbur-w${Math.max(1, w - 1)}`);
  api.notify("member", "revise", "متطلب يحتاج استكمالاً", `الملخص الفقهي — الأسبوع ${w} — ينقصه ذكر الأدلة لمسائل المقطع الثاني`, `fiqh-w${w}`);
  api.notify("reviewer", "submit", "رُفع متطلب جديد", `ورقة التدبر — الأسبوع ${w} — بانتظار تقييمك`, `tadabbur-w${w}`);
  api.save();
}

// ───────────────────────── محوّل Supabase ─────────────────────────
// يُفعَّل عند وجود docs/config.js؛ يستبدل دوال api المحلية بنداءات قاعدة البيانات.
const CFG = window.SIRAJ_CONFIG;
let sb = null, chan = null;
const FONT_KEYS = { light: 300, regular: 400, medium: 500, bold: 700, black: 900 };
async function addFont(key, buf) { try { document.fonts.add(await new FontFace("Thmanyah Brand", buf, { weight: String(FONT_KEYS[key]) }).load()); } catch (e) { console.warn("font", key, e); } }
async function cachedFonts() { await Promise.all(Object.keys(FONT_KEYS).map(async (k) => { try { const b = await idbDo("readonly", (s) => s.get("font:" + k)); if (b) await addFont(k, await b.arrayBuffer()); } catch {} })); }
if (CFG && window.supabase && !DEMO) {
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey);
  const must = (r) => { if (r.error) throw new Error(r.error.message); return r.data; };
  Object.assign(api, {
    mode: "remote", fontsVer: null,
    async load() {
      S = blank(); ME = null; buildReqs();
      const { data: { session } } = await sb.auth.getSession();
      if (!session) return;
      this.uid = session.user.id;
      await this.refresh();
      if (!ME) { await sb.auth.signOut(); return; }
      this.subscribe(); this.loadFonts();
    },
    async refresh() {
      const [pr, st, su, ch, tf, ev, nf, rs] = (await Promise.all([
        sb.from("profiles").select("role,name,user_id"), sb.from("settings").select("*").eq("id", 1).maybeSingle(), sb.from("submissions").select("*"),
        sb.from("checks").select("*"), sb.from("tafsir").select("*"), sb.from("events").select("*").order("date"), sb.from("notifs").select("*").order("at", { ascending: false }).limit(300), sb.from("rasd").select("*"),
      ])).map(must);
      const names = Object.fromEntries(pr.map((p) => [p.role, p.name]));
      const n = blank();
      n.settings = { start: st?.start || n.settings.start, meetings: st?.meetings || [], names: { ...n.settings.names, ...names }, fontFiles: st?.font_files || {}, refs: st?.refs || {}, rasdStart: st?.rasd_start || null };
      su.forEach((s) => (n.subs[s.req_id] = { reqId: s.req_id, title: s.title, body: s.body, file: s.file, at: s.at, status: s.status, score: s.score, note: s.note, reviewedAt: s.reviewed_at, history: s.history || [] }));
      ch.forEach((c) => (n.checks[c.req_id] = c.at));
      rs.forEach((x) => (n.rasd[x.week] = { week: x.week, attendance: x.attendance, from: x.from_text, to: x.to_text, note: x.note, at: x.at }));
      tf.forEach((t) => (n.tafsir[t.day] = true));
      n.events = ev;
      n.notifs = nf.map((x) => ({ id: x.id, to: x.to_role, kind: x.kind, title: x.title, body: x.body, req: x.req, at: x.at, read: x.read }));
      S = n; buildReqs();
      const me = pr.find((p) => p.user_id === this.uid);
      ME = me ? { role: me.role, name: me.name } : null;
    },
    subscribe() {
      if (chan) return;
      let t;
      const pull = () => { clearTimeout(t); t = setTimeout(async () => {
        if (!ME) return;
        const before = unreadMine().length;
        try { await api.refresh(); } catch { return; }
        if (!ME) return render();
        const now = unreadMine();
        if (now.length > before) toast(now[0].title + (now[0].body ? " — " + now[0].body : ""), "notif");
        if (!sheetEl) rerender(); else paintBell();
        api.loadFonts();
      }, 350); };
      chan = sb.channel("siraj").on("postgres_changes", { event: "*", schema: "public" }, pull).subscribe();
      document.addEventListener("visibilitychange", () => { if (!document.hidden) pull(); });
    },
    save() { buildReqs(); },
    notify() {},
    async signIn(email, password) { must(await sb.auth.signInWithPassword({ email: email.trim(), password })); await this.load(); if (!ME) throw new Error("هذا الحساب غير مرتبط بالمنصة"); },
    async activate(email, code, password) { must(await sb.rpc("activate_account", { p_email: email, p_code: code, p_password: password })); await this.signIn(email, password); },
    async signOut() { if (chan) { sb.removeChannel(chan); chan = null; } await sb.auth.signOut(); ME = null; S = blank(); buildReqs(); },
    async markRead(ids) { if (!ids.length) return; must(await sb.from("notifs").update({ read: true }).in("id", ids)); S.notifs.forEach((n) => { if (ids.includes(n.id)) n.read = true; }); },
    async submit(reqId, { title, body, file }) {
      const prev = S.subs[reqId]; let f = prev?.file || null;
      if (file) {
        const ext = (file.name.match(/\.([A-Za-z0-9]{1,8})$/) || [, "bin"])[1].toLowerCase(), path = `${reqId}/${uid()}.${ext}`;
        must(await sb.storage.from("files").upload(path, file, { contentType: file.type || undefined }));
        f = { path, name: file.name, type: file.type, size: file.size };
      }
      must(prev ? await sb.from("submissions").update({ title, body, file: f }).eq("req_id", reqId) : await sb.from("submissions").insert({ req_id: reqId, title, body, file: f }));
      await this.refresh();
    },
    async review(reqId, { status, score, note }) { must(await sb.from("submissions").update({ status, score, note }).eq("req_id", reqId)); await this.refresh(); },
    async saveRasd(week, d) { must(await sb.from("rasd").upsert({ week, attendance: d.attendance, from_text: d.from, to_text: d.to, note: d.note })); await this.refresh(); },
    async toggleCheck(reqId) { must(S.checks[reqId] ? await sb.from("checks").delete().eq("req_id", reqId) : await sb.from("checks").insert({ req_id: reqId })); await this.refresh(); },
    async setTafsir(day, on) { must(on ? await sb.from("tafsir").upsert({ day }, { ignoreDuplicates: true }) : await sb.from("tafsir").delete().eq("day", day)); if (on) S.tafsir[day] = true; else delete S.tafsir[day]; },
    note(kind, title, body, req) { return sb.rpc("send_note", { p_kind: kind, p_title: title, p_body: body || "", p_req: req || null }).then(must); },
    async nudge(reqId) { const r = REQ[reqId]; await this.note("nudge", "تذكير من المتابع", `${r.title} — ${ST[statusOf(r)].label}، ${dueText(r)}`, reqId); },
    async message(text) { await this.note("msg", `رسالة من ${firstName(ME.name)}`, text); },
    async addEvent(ev) { must(await sb.from("events").insert(ev)); await this.note("event", "موعد جديد في التقويم", `${ev.title} — ${fmtDay(ev.date)}`); await this.refresh(); },
    async delEvent(id) { must(await sb.from("events").delete().eq("id", id)); await this.refresh(); },
    async saveSettings(st) {
      const moved = st.meetings.map((d, i) => (d && d !== meetingDate(i + 1) ? i + 1 : 0)).filter(Boolean);
      must(await sb.from("settings").update({ start: st.start, meetings: st.meetings, rasd_start: st.rasdStart || null }).eq("id", 1));
      for (const role of ["reviewer", "member"]) if (st.names[role] !== S.settings.names[role]) must(await sb.from("profiles").update({ name: st.names[role] }).eq("role", role));
      await this.refresh();
      for (const m of moved) await this.note("event", "تغيّر موعد اللقاء", `اللقاء ${ORD[m]} — ${fmtDay(meetingDate(m))}`);
    },
    async addRef(refId, { label, url, file }) {
      const it = { id: uid(), label };
      if (file) {
        const ext = (file.name.match(/\.([A-Za-z0-9]{1,8})$/) || [, "bin"])[1].toLowerCase(); it.path = `refs/${refId}/${it.id}.${ext}`; it.name = file.name;
        must(await sb.storage.from("brand").upload(it.path, file, { contentType: file.type || undefined }));
      } else it.url = url;
      const refs = { ...(S.settings.refs || {}) }; refs[refId] = [...(refs[refId] || []), it];
      must(await sb.from("settings").update({ refs }).eq("id", 1)); await this.refresh();
      await this.note("event", "أُضيف مرجع جديد", label);
    },
    async delRef(refId, id) { const refs = { ...(S.settings.refs || {}) }; refs[refId] = (refs[refId] || []).filter((x) => x.id !== id); must(await sb.from("settings").update({ refs }).eq("id", 1)); await this.refresh(); },
    async refUrl(it) { if (it.url) return it.url; const r = await sb.storage.from("brand").createSignedUrl(it.path, 3600); return r.data?.signedUrl || null; },
    async fileUrl(f) { if (!f?.path) return null; const r = await sb.storage.from("files").createSignedUrl(f.path, 3600); return r.data?.signedUrl || null; },
    async memberInvite() { const r = await sb.rpc("member_invite"); return r.data || null; },
    async uploadFonts(files) {
      const ff = { ...(S.settings.fontFiles || {}) }; let n = 0;
      for (const file of files) {
        const key = Object.keys(FONT_KEYS).find((k) => file.name.toLowerCase().includes(k)); if (!key) continue;
        const path = `fonts/${key}.otf`;
        must(await sb.storage.from("brand").upload(path, file, { upsert: true, contentType: "font/otf" }));

      }

    },
    // خطوط الهوية محفوظة في مخزن خاص (لا تُنشر علناً) وتُخزَّن في المتصفح بعد أول دخول
    async loadFonts() {
      const ff = S.settings.fontFiles || {}, ver = JSON.stringify(ff);
      if (ver === this.fontsVer) return; this.fontsVer = ver;
      for (const [k, f] of Object.entries(ff)) {
        if (!FONT_KEYS[k] || localStorage.getItem("siraj.font." + k) === String(f.v)) continue;
        const r = await sb.storage.from("brand").download(f.path); if (r.error) continue;
        try { await idbDo("readwrite", (s) => s.put(r.data, "font:" + k)); localStorage.setItem("siraj.font." + k, String(f.v)); } catch {}
        await addFont(k, await r.data.arrayBuffer());
      }
    },
  });
}

function toast(msg, kind = "") {
  const t = document.createElement("div");
  t.className = "toast " + kind; t.textContent = msg;
  $("#toasts").appendChild(t);
  setTimeout(() => { t.classList.add("bye"); setTimeout(() => t.remove(), 300); }, 3200);
}
let sheetEl = null;
function openSheet(html, mount) {
  closeSheet();
  sheetEl = document.createElement("div");
  sheetEl.className = "scrim";
  sheetEl.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><button class="sx" data-close aria-label="إغلاق">${I.x}</button>${html}</div>`;
  sheetEl.addEventListener("click", (e) => { if (e.target === sheetEl || e.target.closest("[data-close]")) closeSheet(); });
  document.body.appendChild(sheetEl);
  document.body.classList.add("lock");
  mount && mount($(".sheet", sheetEl));
}
function closeSheet() { sheetEl?.remove(); sheetEl = null; document.body.classList.remove("lock"); }
const stars = (n, cls = "") => `<span class="stars ${cls}" aria-label="${n} من 5">${[1, 2, 3, 4, 5].map((i) => `<i class="${i <= n ? "on" : ""}">${I.star}</i>`).join("")}</span>`;
const chip = (st) => `<span class="chip ${st}">${ST[st].icon}${ST[st].label}</span>`;
const pct = (v) => Math.round(v * 100);
const isMember = () => ME?.role === "member";

function showGreeting(force) {
  if (!ME || (!force && (showGreeting.done || QS.has("nogreet")))) return;
  showGreeting.done = true;
  const st = stats(), p = nowPos(), q = pickQuote(ME.role);

  if (isMember()) {
    if (p.phase === "before") sub = `ينطلق المشروع بعد ${daysWord(-p.di)}، فهيّئ نفسك`;
    else if (st.revise.length + st.late.length) sub = `بانتظارك ${st.revise.length + st.late.length} من المتطلبات، تداركها اليوم`;
    else if (p.phase === "during" && !S.tafsir[today()]) sub = "وجهُ اليوم بانتظارك";
    else sub = `أنجزت ${pct(st.overall)}٪ من الطريق`;

}

async function bulkRefs(files) {
  let n = 0; const miss = [];
  for (const f of files) {
    if (f.size > 50 * 1024 * 1024) { miss.push(f.name + " (أكبر من 50 م.ب)"); continue; }
    const m = REF_MATCH.find(([, re]) => re.test(f.name.normalize("NFC")));
    if (!m) { miss.push(f.name); continue; }
    toast(`جارٍ رفع: ${f.name}`);
    await api.addRef(m[0], { label: REFS.find((r) => r.id === m[0]).title + " (PDF)", file: f }); n++;
  }
  rerender();
  toast(n ? `رُفع ${n} من الكتب${miss.length ? ` · لم أتعرف على: ${miss.join("، ")}` : ""}` : `لم أتعرف على الملفات: ${miss.join("، ")}`, n ? "ok" : "err");
}

       <div class="gitem col"><small>المستفيد</small><b>${esc(S.settings.names.member)}</b><ul class="bul"><li>الالتزام بالورد والجلسة والملخص الأسبوعي</li><li>قراءة مصدر كل لقاء قبل موعده</li><li>حضور اللقاءات الشهرية الستة</li><li>تطبيق كل جدارة في الميدان وتوثيقها</li></ul></div></div>`)}
    ${sec("out", "14 · المخرج النهائي", "ما يخرج به المربي بعد ستة أشهر", "ملف الإنجاز: كل ما سبق محفوظ على المنصة، ويُعرض حصاده في اللقاء الختامي.",
      `<div class="glist">${[["01", "تفسير وتدبر", "إتمام التفسير الميسر لربع يس، مع أوراق تدبر أسبوعية محفوظة"], ["02", "ملف شرعي", "ملخصات أسبوعية للفقه الأكبر والمدخل وفقه العبادات، مرجعٌ عملي للمربي"], ["03", "جدارات موثقة", "ملخصات مصادر اللقاءات الستة وشواهد تطبيقها، وبرنامج تربوي محضّر ومقدَّم"]].map(([a, b, c]) => `<div class="gitem col"><small>${a}</small><b>${b}</b><small>${c}</small></div>`).join("")}</div>`)}
    <section class="mhead gend"><div class="h-rays"></div><h1>سراج</h1><p>نورٌ يُوقَد في المربي، ليضيء به مَن حوله</p></section>`;
}

// ───────────────────────── تقرير المستفيد (للطباعة) ─────────────────────────
function reportView() {
  const st = stats(), p = nowPos(), t = today(), ms = [1, 2, 3, 4, 5, 6];
  const subs = Object.values(S.subs).filter((s) => REQ[s.reqId]).sort((a, b) => (REQ[a.reqId].due < REQ[b.reqId].due ? -1 : 1));
  const reviewable = REQS.filter((r) => r.type !== "read"), dueR = reviewable.filter((r) => r.due < t);
  const approved = subs.filter((s) => s.status === "approved").length;
  const kpi = [[pct(st.overall) + "٪", "الإنجاز الكلي", `المخطط حتى اليوم ${pct(st.expected)}٪`], [p.phase === "before" ? "—" : pct(st.committed) + "٪", "نسبة الالتزام", "مما حلّ موعده"], [st.avg ? st.avg.toFixed(1) : "—", "متوسط التقييم", st.scored ? `من 5 · ${st.scored} تقييماً` : "لا تقييمات بعد"],
    [`${st.tafsirDone}`, "أوجه التفسير", `من ${TOTAL_DAYS} وجهاً`], [`${subs.length}`, "ملفات مرفوعة", `${approved} معتمدة`], [`${st.late.length}`, "متطلبات متأخرة", st.revise.length ? `${st.revise.length} تحتاج استكمالاً` : "لا استكمالات معلّقة"]];
  const stName = { approved: "معتمد", submitted: "بانتظار التقييم", revise: "يحتاج استكمالاً", late: "متأخر", due: "مطلوب", upcoming: "قادم", done: "تمّ" };
  const cell = (r) => { const s = statusOf(r); return `<span class="rc ${s}">${s === "approved" && S.subs[r.id]?.score ? S.subs[r.id].score + "/5" : s === "upcoming" ? "·" : stName[s]}</span>`; };
  const heat = Array.from({ length: WEEKS }, (_, w) => `<div class="hw">${Array.from({ length: 7 }, (_, d) => { const ds = addDays(startDate(), w * 7 + d); return `<i class="${S.tafsir[ds] ? "on" : ds < t ? "miss" : ds === t ? "now" : ""}"></i>`; }).join("")}<small>${w + 1}</small></div>`).join("");
  const mrows = ms.map((m) => {
    const ws = [1, 2, 3, 4].map((i) => (m - 1) * 4 + i); let td = 0;
    for (let i = 0; i < 28; i++) if (S.tafsir[addDays(weekStart(ws[0]), i)]) td++;
    const c = (ty) => ws.filter((w) => isDone(REQ[`${ty}-w${w}`])).length;
    const sc = REQS.filter((r) => r.month === m && S.subs[r.id]?.score).map((r) => S.subs[r.id].score);
    return [`${ORD[m]}<small>${MONTHS[m].meet}</small>`, `${td}/28`, `${c("tadabbur")}/4`, `${c("fiqh")}/4`, `${c("read")}/4`, `${c("rasd")}/4`, cell(REQ[`source-m${m}`]), cell(REQ[`report-m${m}`]), sc.length ? (sc.reduce((a, b) => a + b, 0) / sc.length).toFixed(1) : "—"];
  });
  const open = [...st.revise, ...st.late];
  return `<div class="rp-tools"><div><h2>تقرير المستفيد</h2><small>يُطبع على ورق A4 أو يُحفظ بصيغة PDF من نافذة الطباعة</small></div><button class="btn gold" data-print>${I.file} طباعة / حفظ PDF</button></div>
  <article class="report">
    <header class="rp-head"><div class="h-rays"></div>${lantern("rpl")}<div class="grow"><small>مشروع سراج · المجلس التربوي</small><h1>تقرير إنجاز المستفيد</h1><h2>${esc(S.settings.names.member)}</h2></div>
      <div class="rp-date"><small>تاريخ التقرير</small><b>${fmtDay(t)}</b><small>${fmtHijri(t)}</small><small>${p.phase === "before" ? "قبل انطلاق المشروع" : p.phase === "after" ? "بعد ختام المشروع" : `اليوم ${p.day} من ${TOTAL_DAYS} · الأسبوع ${p.week} · الشهر ${ORD[p.month]}`}</small></div></header>
    <section class="rp-kpis">${kpi.map(([v, l, s]) => `<div><b>${v}</b><span>${l}</span><small>${s}</small></div>`).join("")}</section>
    <section class="rp-row">
      <div class="rp-box rp-ring"><h3>التقدم الكلي</h3>${ring(st.overall, `<b>${pct(st.overall)}<i>٪</i></b><small>من المشروع</small>`)}
        <div class="rp-vs"><div><span>الفعلي</span><div class="bar"><i style="width:${pct(st.overall)}%;background:var(--gold)"></i></div><em>${pct(st.overall)}٪</em></div><div><span>المخطط</span><div class="bar"><i style="width:${pct(st.expected)}%;background:var(--night3)"></i></div><em>${pct(st.expected)}٪</em></div></div>
        <p class="rp-verdict ${st.overall - st.expected >= -0.01 && !st.late.length ? "good" : "slow"}">${p.phase === "before" ? "لم يبدأ المشروع بعد" : st.overall - st.expected >= -0.01 && !st.late.length ? "المستفيد على المسار المخطط" : st.late.length ? `متأخر في ${st.late.length} من المتطلبات` : `متأخر ${Math.max(1, pct(st.expected - st.overall))}٪ عن المخطط`}</p></div>
      <div class="rp-box"><h3>الجدارات الخمس</h3><div class="comps">${Object.entries(COMPS).map(([k, c]) => `<div class="comp"><span class="ric c-${k}">${c.icon}</span><div class="grow"><div class="row"><b>${c.name}</b><span class="grow"></span><em>${pct(st.byComp[k])}٪</em></div><div class="bar"><i class="c-${k}" style="width:${pct(st.byComp[k])}%"></i></div><small>${c.desc}</small></div></div>`).join("")}</div></div>
    </section>
    <section class="rp-box"><h3>خريطة الورد اليومي — التفسير الميسر <small>(${st.tafsirDone} من ${st.passed} يوماً مضت · أطول التزام حالي ${daysWord(st.streak || 0)})</small></h3>
      <div class="heat">${heat}</div><div class="legend"><span><i class="sq on"></i>مُنجز</span><span><i class="sq miss"></i>فائت</span><span><i class="sq"></i>قادم</span><span>الأعمدة: أسابيع المشروع (1–24) · الصفوف: السبت إلى الجمعة</span></div></section>
    <section class="rp-box"><h3>الإنجاز الشهري</h3>${tbl(["الشهر", "التفسير", "التدبر", "الفقه", "القراءة", "الرصد", "ملخص المصدر", "التقرير الشهري", "متوسط التقييم"], mrows, "rpt")}</section>
    ${(() => { const rs = Object.values(S.rasd).sort((a, b) => a.week - b.week); if (!rs.length) return ""; const pr = rs.filter((x) => x.attendance === "present").length;
      return `<section class="rp-box"><h3>الرصد الأسبوعي: حضور الحلقة والتسميع <small>(حضر ${pr} من ${rs.length} أسبوعاً مرصوداً · نسبة الحضور ${pct(pr / rs.length)}٪)</small></h3>${tbl(["الأسبوع", "الفترة", "الحضور", "التسميع من", "إلى", "ملاحظات"], rs.map((x) => [x.week >= 1 ? x.week : "تمهيدي", `${fmtShort(weekStart(x.week))} – ${fmtShort(weekEnd(x.week))}`, `<span class="rc ${x.attendance === "present" ? "approved" : x.attendance === "excused" ? "revise" : "late"}">${ATT[x.attendance]}</span>`, esc(x.from || "—"), esc(x.to || "—"), esc(x.note || "—")]), "rpt")}</section>`; })()}
    <section class="rp-box"><h3>سجل المتطلبات المرفوعة وتقييمها <small>(${subs.length} من ${dueR.length} حلّ موعدها)</small></h3>
      ${subs.length ? tbl(["المتطلب", "تاريخ الرفع", "الحالة", "التقييم", "ملاحظة المقيّم"], subs.map((s) => [esc(REQ[s.reqId].title), fmtShort(d2s(new Date(s.at))), `<span class="rc ${s.status}">${stName[s.status]}</span>`, s.score ? stars(s.score, "sm") : "—", esc(s.note || "—")]), "rpt log") : `<p class="mute">لم تُرفع متطلبات بعد.</p>`}</section>
    ${open.length ? `<section class="rp-box"><h3>متطلبات تحتاج متابعة</h3>${tbl(["المتطلب", "الحالة", "الموعد"], open.map((r) => [esc(r.title), `<span class="rc ${statusOf(r)}">${stName[statusOf(r)]}</span>`, dueText(r)]), "rpt")}</section>` : ""}
    <section class="rp-box rp-note"><h3>ملاحظات المتابع وتوصياته</h3><div class="rp-edit" contenteditable="${isMember() ? "false" : "true"}" data-ph="${isMember() ? "" : "اكتب هنا ملاحظاتك قبل الطباعة…"}"></div>
      <div class="rp-sign"><div><small>المتابع والمقيّم</small><b>${esc(S.settings.names.reviewer)}</b><i></i></div><div><small>المستفيد</small><b>${esc(S.settings.names.member)}</b><i></i></div></div></section>
    <footer class="rp-foot">منصة سراج · نورٌ يُوقَد في المربي، ليضيء به مَن حوله · صدر التقرير ${fmtShort(t)}</footer>
  </article>`;
}

// ───────────────────────── التشغيل والتوجيه ─────────────────────────
function route() { const [r, a] = (location.hash.replace(/^#\/?/, "") || "home").split("/"); return { r: ["home", "path", "cal", "file", "guide", "report"].includes(r) ? r : "home", a }; }
function render() {
  const app = $("#app");
  if (!ME) { app.innerHTML = loginView(); return; }
  const { r, a } = route(), y = window.scrollY;
  app.innerHTML = shell(r);
  $("#view").innerHTML = `<div class="page p-${r} ${render.keep ? "" : "anim"}">${{ home: homeView, path: () => pathView(a), cal: calView, file: fileView, guide: () => guideView(), report: reportView }[r]()}</div>`;
  window.scrollTo(0, render.keep ? y : 0); render.keep = false;
  if (r === "guide" && a) $("#g-" + a)?.scrollIntoView();
}
const rerender = () => { render.keep = true; render(); };

document.addEventListener("click", async (e) => {
  const q = (s) => e.target.closest(s);
  let b;
  if ((b = q("[data-authmode]"))) { const f = $("#authf"); f.dataset.mode = f.dataset.mode === "in" ? "act" : "in"; $("[name=password]", f).autocomplete = f.dataset.mode === "in" ? "current-password" : "new-password"; return; }
  if ((b = q("[data-login]"))) { await api.signIn(b.dataset.login); location.hash = "#/home"; render(); showGreeting(); return; }
  if ((b = q("[data-act]"))) return { notifs: notifSheet, account: accountSheet }[b.dataset.act]?.();
  if (sheetEl?.contains(e.target)) return;
  if ((b = q("[data-nudge]"))) { e.stopPropagation(); await api.nudge(b.dataset.nudge); return toast("أُرسل التذكير للمستفيد", "ok"); }
  if ((b = q("[data-tafsir-today]"))) { if (!isMember()) return; const t = today(); await api.setTafsir(t, !S.tafsir[t]); if (S.tafsir[t]) toast("بارك الله فيك — سُجّل وجه اليوم", "ok"); return rerender(); }
  if ((b = q("[data-tafsir]"))) { const d = b.dataset.tafsir; await api.setTafsir(d, !S.tafsir[d]); return rerender(); }
  if ((b = q("[data-delev]"))) { await api.delEvent(b.dataset.delev); return rerender(); }
  if ((b = q("[data-addev]"))) return eventSheet();
  if ((b = q("[data-readn]"))) { await api.markRead([b.dataset.readn]); if (!b.dataset.req) return rerender(); }
  if ((b = q("[data-req]"))) return reqSheet(b.dataset.req);
  if ((b = q("[data-go]"))) return (location.hash = b.dataset.go);
  if ((b = q("[data-day]"))) { calSel = b.dataset.day; return rerender(); }
  if ((b = q("[data-cal]"))) { const [y, m] = calYM.split("-").map(Number), d = new Date(y, m - 1 + +b.dataset.cal, 1, 12); calYM = d2s(d).slice(0, 7); return rerender(); }
  if ((b = q("[data-print]"))) return window.print();
  if ((b = q("[data-refadd]"))) return refSheet(b.dataset.refadd);
  if ((b = q("[data-refdel]"))) { const [r, id] = b.dataset.refdel.split(":"); await api.delRef(r, id); return rerender(); }
  if ((b = q("[data-refopen]"))) { const [r, id] = b.dataset.refopen.split(":"), it = (S.settings.refs?.[r] || []).find((x) => x.id === id); if (!it) return; if (it.url) return window.open(it.url, "_blank", "noopener"); const w = window.open("", "_blank"), u = await api.refUrl(it); if (u && w) w.location = u; else { w?.close(); toast("تعذّر فتح الملف", "err"); } return; }
  if ((b = q("[data-gsec]"))) return $("#g-" + b.dataset.gsec)?.scrollIntoView({ behavior: "smooth", block: "start" });
  if ((b = q("[data-ff]"))) { fileFilter = b.dataset.ff; return rerender(); }
});
document.addEventListener("change", async (e) => { if (e.target.id !== "bulk-refs") return; const fs = [...e.target.files]; if (fs.length) try { await bulkRefs(fs); } catch (err) { toast("تعذّر الرفع: " + err.message, "err"); rerender(); } });
document.addEventListener("submit", async (e) => {
  const f = e.target.closest("#authf"); if (!f) return;
  e.preventDefault();
  const d = Object.fromEntries(new FormData(f)), btn = $("button[type=submit]", f);
  if (!d.email || !d.password) return toast("أدخل البريد وكلمة المرور", "err");
  btn.disabled = true;
  try {
    if (f.dataset.mode === "act") await api.activate(d.email, d.code || "", d.password); else await api.signIn(d.email, d.password);
    location.hash = "#/home"; render(); showGreeting();
  } catch (err) { btn.disabled = false; toast(/Invalid login/i.test(err.message) ? "البريد أو كلمة المرور غير صحيحة" : err.message, "err"); }
});
window.addEventListener("unhandledrejection", (e) => { toast("تعذّر تنفيذ العملية: " + (e.reason?.message || e.reason), "err"); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); if (e.key === "Enter" && e.target.matches?.(".al[role=button]")) e.target.click(); });
window.addEventListener("hashchange", () => { closeSheet(); render(); });
// مزامنة فورية بين نافذتين في المتصفح نفسه (حساب المتابع وحساب المستفيد)
window.addEventListener("storage", (e) => {
  if (api.mode !== "local" || e.key !== KEY || !ME) return;
  const before = unreadMine().length; api.read();
  const now = unreadMine();
  if (now.length > before) toast(now[0].title + (now[0].body ? " — " + now[0].body : ""), "notif");
  if (!sheetEl) rerender();
});

(async function boot() {
  if (api.mode === "remote") await cachedFonts();
  try { await api.load(); } catch (err) { console.error(err); toast("تعذّر الاتصال بقاعدة البيانات", "err"); }
  try { await Promise.race([document.fonts.load('700 20px "Thmanyah Serif Text"'), new Promise((r) => setTimeout(r, 1500))]); } catch {}
  render();
  showGreeting();
  if (DEMO && QS.get("open")) reqSheet(QS.get("open"));
})();

</script>
</body>
</html>
